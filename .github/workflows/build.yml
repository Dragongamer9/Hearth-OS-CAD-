# Hearth OS CAD: bundle the page, test it in Chromium and WebKit (the engine the app uses on Linux) with
# screenshots, then build the app, run its unit tests, photograph the real window, and make a .deb.
# Screenshots are pushed to the `shots` branch (shots/<branch>/...) so they can be looked at without downloading.
name: Build

on:
  push:
    branches: ["feature/**", main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the shots branch

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Packages
        run: npm install --no-audit --no-fund 2>&1 | tail -5
      - name: Syntax
        run: for f in web/src/*.js scripts/*.mjs tests/*.mjs; do node --check "$f"; done
      - name: Bundle the page
        run: |
          set -o pipefail
          node scripts/build-web.mjs 2>&1 | tee bundle.log || { echo "::error title=Bundle::$(grep -iE 'error|✘' -A4 bundle.log | head -40 | tr '\n' '|' | cut -c1-3500)"; exit 1; }
          echo "::notice title=Bundle::$(grep -E 'MB$' bundle.log | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: ui
          path: app/ui
          retention-days: 7
      - name: Browsers
        run: npx playwright install --with-deps chromium webkit >/dev/null 2>&1
      - name: Smoke test in Chromium
        run: BROWSER=chromium node tests/smoke.mjs
      - name: Smoke test in WebKit
        if: always()
        continue-on-error: true
        run: BROWSER=webkit node tests/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-web
          path: shots
          retention-days: 7
      - name: Publish screenshots to the shots branch
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/push-shots.sh web

  app:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui
          path: app/ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WebKitGTK and friends
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev xvfb x11-utils imagemagick dbus-x11 fonts-dejavu fonts-noto-core mesa-utils libgl1-mesa-dri >/dev/null
      - name: Unit tests (files and settings)
        working-directory: app
        run: |
          set -o pipefail
          cargo test --lib 2>&1 | tee ../test.log || { echo "::error title=Unit tests::$(grep -E '^(error|---- |thread .* panicked)' -A8 ../test.log | head -60 | tr '\n' '|' | cut -c1-3800)"; exit 1; }
          echo "::notice title=Unit tests::$(grep -E '^test result' ../test.log | tr '\n' ' ')"
      - name: Build the app and the .deb
        working-directory: app
        run: |
          set -o pipefail
          npx --yes @tauri-apps/cli@2 build --bundles deb 2>&1 | tee ../build.log || { echo "::error title=Build::$(grep -E '^error' -A10 ../build.log | head -60 | tr '\n' '|' | cut -c1-3800)"; exit 1; }
          ls -la target/release/bundle/deb/
          echo "::notice title=Built::$(ls target/release/bundle/deb/*.deb | xargs -n1 basename) $(du -h target/release/bundle/deb/*.deb | cut -f1)"
      - name: The real window (WebKitGTK under Xvfb)
        continue-on-error: true
        run: |
          mkdir -p shots/app
          export HEARTH_OS_CAD_SETTINGS="$RUNNER_TEMP/settings.json"
          xvfb-run -a -s "-screen 0 1440x900x24" bash -c '
            ./app/target/release/hearth-os-cad > app.log 2>&1 &
            for i in $(seq 1 60); do sleep 1; xwininfo -root -tree | grep -q "Hearth OS CAD" && break; done
            sleep 25
            import -window root shots/app/01-window.png
            kill %1 || true'
          tail -20 app.log || true
          ls -la shots/app
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-os-cad-deb
          path: app/target/release/bundle/deb/*.deb
          retention-days: 14
      - name: Publish screenshots to the shots branch
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/push-shots.sh app
